<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ</title><meta name="description" content="売却を決めていない段階でも大丈夫です。無料相談・無料査定をご利用ください。"><link rel="stylesheet" href="../style.css"><link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" href="../favicon.svg" type="image/svg+xml"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../"><img class="brand-logo" src="../images/logo-frog.svg" width="44" height="44" alt="こいけ不動産 カエルロゴ（仮）"><span>こいけ不動産<small>遠方不動産も安心して相談できる会社</small></span></a><button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button><nav class="nav"><a href="../sale/">売却・買取</a><a href="../inheritance-vacant-house/">相続・空き家</a><a href="../#areas">対応エリア</a><a href="../minpaku-management/">民泊管理</a><a href="../company/">会社概要</a><a class="cta" href="../contact/">無料相談</a></nav></div></header><main><section class="subhero"><div class="container"><div class="breadcrumb"><a href="../">トップ</a> / お問い合わせ</div><h1>お問い合わせ</h1><p class="lead">売却を決めていない段階でも大丈夫です。無料相談・無料査定をご利用ください。</p></div></section><section class="section"><div class="container grid grid-2"><div><h2>ご相談内容をお聞かせください</h2><p>相続、空き家、古家、遠方不動産、訳あり物件、売却・買取・活用方法など、状況に合わせてご案内します。</p><div class="card" id="contact-options"><h3>連絡先（公開前に設定してください）</h3><table class="status-table"><tr><th>電話番号</th><td>要入力</td></tr><tr><th>メールアドレス</th><td>要入力</td></tr><tr><th>LINE公式アカウント</th><td>要入力</td></tr></table></div></div><form class="form card" data-contact-form action="#" method="post"><div class="field"><label>お名前 *</label><input required name="name"></div><div class="field"><label>メールアドレス *</label><input required type="email" name="email"></div><div class="field"><label>電話番号</label><input name="phone"></div><div class="field"><label>物件所在地</label><input name="property_address" placeholder="都道府県・市区町村"></div><div class="field"><label>ご相談内容 *</label><select required name="type"><option value="">選択してください</option><option>相続不動産</option><option>空き家・古家</option><option>遠方不動産</option><option>訳あり物件</option><option>仲介売却</option><option>不動産買取</option><option>賃貸・民泊活用</option></select></div><div class="field"><label>詳細</label><textarea name="message"></textarea></div><div class="notice"><strong>送信先は未設定です。</strong><br>現在は入力画面の確認用です。送信ボタンを押しても内容は送信されません。</div><button class="btn primary" type="submit">送信動作を確認する</button><p class="note">公開前にCloudflare Workers、フォームサービス等の送信先を設定してください。設定方法はREADME.mdに記載しています。</p></form></div></section></main><footer class="site-footer"><div class="container"><div class="footer-title">こいけ不動産</div><p class="small">遠方の不動産も、安心して相談できる会社。</p><div class="copyright">© 2026 KOIKE REAL ESTATE.</div></div></footer><div class="mobile-cta"><a href="../contact/#contact-options">☎<br>電話</a><a href="../contact/#contact-options">LINE<br>相談</a><a href="../contact/?type=assessment">無料<br>査定</a><a href="../contact/">無料<br>相談</a></div><script src="../script.js"></script></body></html>
