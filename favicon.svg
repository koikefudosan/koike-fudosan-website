<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相続・空き家・古家相談</title><meta name="description" content="相続した実家、管理できない空き家、荷物が残った古家など、複雑な状況も整理します。"><link rel="stylesheet" href="../style.css"><link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" href="../favicon.svg" type="image/svg+xml"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../"><img class="brand-logo" src="../images/logo-frog.svg" width="44" height="44" alt="こいけ不動産 カエルロゴ（仮）"><span>こいけ不動産<small>遠方不動産も安心して相談できる会社</small></span></a><button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button><nav class="nav"><a href="../sale/">売却・買取</a><a href="../inheritance-vacant-house/">相続・空き家</a><a href="../#areas">対応エリア</a><a href="../minpaku-management/">民泊管理</a><a href="../company/">会社概要</a><a class="cta" href="../contact/">無料相談</a></nav></div></header><main><section class="subhero"><div class="container"><div class="breadcrumb"><a href="../">トップ</a> / 相続・空き家・古家相談</div><h1>相続・空き家・古家相談</h1><p class="lead">相続した実家、管理できない空き家、荷物が残った古家など、複雑な状況も整理します。</p></div></section><section class="section"><div class="container"><div class="grid grid-2"><div class="card"><h3>相続した実家</h3><p>相続登記前、共有、相続人が複数いる場合も状況整理から対応します。</p></div><div class="card"><h3>空き家・古家</h3><p>現況売却、片付け、解体、賃貸活用を比較します。</p></div></div></div></section><section class="section green"><div class="container"><h2>遠方でも進めやすい仕組み</h2><div class="flow"><div class="step"><b>01</b><h3>オンライン相談</h3><p>所在地と状況を確認します。</p></div><div class="step"><b>02</b><h3>調査</h3><p>登記・法令・相場を確認します。</p></div><div class="step"><b>03</b><h3>比較</h3><p>売却・買取・活用を比較します。</p></div><div class="step"><b>04</b><h3>実行</h3><p>現地対応や専門家連携を進めます。</p></div></div><div class="btns"><a class="btn primary" href="../contact/">無料で相談する</a></div></div></section></main><footer class="site-footer"><div class="container"><div class="footer-title">こいけ不動産</div><p class="small">遠方の不動産も、安心して相談できる会社。</p><div class="copyright">© 2026 KOIKE REAL ESTATE.</div></div></footer><div class="mobile-cta"><a href="../contact/#contact-options">☎<br>電話</a><a href="../contact/#contact-options">LINE<br>相談</a><a href="../contact/?type=assessment">無料<br>査定</a><a href="../contact/">無料<br>相談</a></div><script src="../script.js"></script></body></html>
