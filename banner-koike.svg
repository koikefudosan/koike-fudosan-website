<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" role="img" aria-labelledby="t d"><title id="t">こいけ不動産バナー</title><desc id="d">相続・空き家・古家相談を案内する横長バナー</desc><rect width="1774" height="887" fill="#fff"/><g transform="translate(25 225)"><path d="M0 0h67v88L270 0v70L90 150l190 115h-91l-122-73v148H0z" fill="#0b2d79"/><ellipse cx="190" cy="92" rx="84" ry="50" fill="#16b354"/><text x="145" y="82" font-family="Arial,'Noto Sans JP',sans-serif" font-size="24" font-weight="800" fill="#ffe441">地域密着で</text><text x="139" y="116" font-family="Arial,'Noto Sans JP',sans-serif" font-size="24" font-weight="800" fill="#fff">安心サポート!</text><g transform="translate(125 132)"><ellipse cx="64" cy="38" rx="60" ry="35" fill="#20b95c"/><circle cx="36" cy="14" r="16" fill="#20b95c"/><circle cx="92" cy="14" r="16" fill="#20b95c"/><circle cx="36" cy="14" r="5" fill="#111"/><circle cx="92" cy="14" r="5" fill="#111"/><path d="M35 45h48" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M25 65c-5 15-4 42 4 63h21V79h13v49h28c7-21 8-48 2-63-18 11-51 11-68 0z" fill="#20b95c"/><path d="M47 78c-8 12-11 30-9 47M72 79c6 12 9 30 7 47" fill="none" stroke="#08713a" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(430 220)"><text x="0" y="0" font-family="Arial,'Noto Sans JP',sans-serif" font-size="48" font-weight="800" fill="#0b2d79">＼ 不動産のことならお任せください！ ／</text><text x="0" y="155" font-family="Arial,'Noto Sans JP',sans-serif" font-size="118" font-weight="900" fill="#111">こいけ不動産</text><line x1="0" y1="205" x2="850" y2="205" stroke="#16a34a" stroke-width="4"/><text x="15" y="260" font-family="Arial,'Noto Sans JP',sans-serif" font-size="38" font-weight="800" fill="#0b2d79">不動産売却・買取・相続相談・空き家・古家</text><line x1="0" y1="294" x2="850" y2="294" stroke="#16a34a" stroke-width="4"/></g><g transform="translate(1330 220)"><rect width="360" height="360" rx="20" fill="#f6fbef" stroke="#15963c" stroke-width="6"/><path d="M28 93l45-39 45 39v55H28z" fill="#15963c"/><rect x="52" y="